services
  - type web
    name casino-bot
    env python
    plan free
    buildCommand pip install -r requirements.txt
    startCommand python bot.py
    envVars
      - key BOT_TOKEN
        sync false
        description Токен Telegram бота от @BotFather
      - key WEBAPP_URL
        sync false
        description URL вашего приложения (httpsназвание.onrender.com)
    healthCheckPath 
    autoDeploy true