services:
  - type: web
    name: casino-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: casino-db
          property: connectionString
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: casino-db
    plan: free
